plugins {
  id 'dev.clojurephant.clojure' version '0.8.0'
  id 'maven-publish'
}

group = 'my.group'
version = '0.1.0-SNAPSHOT'

repositories {
  mavenCentral()
  maven {
    name = 'clojars'
    url = 'https://repo.clojars.org'
  }
}

dependencies {
  implementation 'org.clojure:clojure:1.12.0'

  testRuntimeOnly 'dev.clojurephant:jovial:0.4.2'

  devImplementation 'org.clojure:tools.namespace:1.5.0'
}

tasks.withType(Test) {
  useJUnitPlatform()
}

publishing {
  publications {
    main(MavenPublication) {
      from components.java
    }
  }
  repositories {
    maven {
      name = 'clojars'
      url = 'https://repo.clojars.org'
      credentials {
        username = System.env['CLOJARS_USER']
        password = System.env['CLOJARS_PASSWORD']
      }
    }
  }
}
